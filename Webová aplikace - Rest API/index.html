<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries API Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-wrapper">

    <div class="page-header">
        <h1>Where in the world?</h1>
        <button id="darkModeToggle" class="dark-mode-btn">
            <i class="fa-regular fa-moon"></i> <span>Dark Mode</span>
        </button>
    </div>

    <div class="Page-filter">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for a country...">
        </div>
        <div class="region-filter">
            <select id="regionSelect">
                <option value="all">Filter by Region</option>
                <option value="Africa">Africa</option>
                <option value="Americas">Americas</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="Oceania">Oceania</option>
            </select>
        </div>
    </div>

    <div id="resultsCount" class="results-count"></div>

    <div id="countries" class="countries-container"></div>

</div>
<script src="script.js"></script>
</body>
</html>
